name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/my-node-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      # 1) Pega o código da aplicação
      - name: Checkout app repository
        uses: actions/checkout@v4

      # 1b) Pega o código do repo de deploy
      - name: Checkout deploy repository
        uses: actions/checkout@v4
        with:
          repository: marceloNascimentoDev/my-deploy  # repo com k8s/deployment.yaml
          path: k8s-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2) Habilita QEMU para builds multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # 3) Habilita o buildx (build avançado do Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4) Loga no GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5) Build e push usando build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max
          platforms: linux/amd64,linux/arm64

      # 6) Atualiza deployment.yaml no repo de deploy
      - name: Update deployment.yaml image
        run: |
          sed -i "s|ghcr.io/vitoriadinizdev/my-node-app:.*|ghcr.io/vitoriadinizdev/my-node-app:${{ github.sha }}|g" k8s-repo/k8s/deployment.yaml

      # 7) Commit e push do repo de deploy
      - name: Commit and push
        run: |
          cd k8s-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push
